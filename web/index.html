<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FT-HX CFD Studio — 3D 해석 전용 형상 설계</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF4FC; --card:#FFFFFF; --tint:#E4EFFB; --sky-l:#DBEDFB;
  --line:#C9DDF2; --line2:#E4EDF8;
  --ink:#0F3055; --dim:#5B7EA1; --dimmer:#93ADC7;
  --blue:#1F7AE0; --blue-d:#1466C4; --blue-l:#3E93EC; --sky:#4FB3EE;
  --copper:#C8763C; --ref:#7C5CE0; --ref-l:#F0EBFC; --bad:#DC5B4C;
  --r:13px; --r2:9px; --r3:7px;
  --sh1:0 1px 2px rgba(15,48,85,.05), 0 2px 8px rgba(15,48,85,.045);
  --sh2:0 2px 5px rgba(15,48,85,.09), 0 10px 24px rgba(15,48,85,.08);
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --sans:"IBM Plex Sans KR","IBM Plex Sans",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans); font-weight:400;
  display:flex; flex-direction:column; overflow:hidden; -webkit-font-smoothing:antialiased;
}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ───────── 헤더 ───────── */
header{
  flex:0 0 auto; display:flex; align-items:center; gap:14px; padding:11px 18px; flex-wrap:wrap;
  background:var(--card); border-bottom:1px solid var(--line2);
  box-shadow:0 1px 3px rgba(15,48,85,.05);
}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:var(--mono);font-weight:600;font-size:14px;letter-spacing:.05em;color:var(--blue-d)}
.brand span{font-size:11.5px;color:var(--dim)}
.spacer{flex:1}
.chips{display:flex;gap:7px}
button{font-family:inherit;color:inherit;cursor:pointer;transition:transform .1s, box-shadow .14s, background .14s, border-color .14s}

/* 볼륨감 있는 버튼 */
.act,.chip{
  border-radius:var(--r2); border:1px solid var(--line);
  background:linear-gradient(180deg,#FFFFFF 0%,#EDF4FC 100%);
  box-shadow:inset 0 1px 0 #fff, 0 1px 1.5px rgba(15,48,85,.06), 0 2px 6px rgba(15,48,85,.07);
  font-family:var(--mono); letter-spacing:.04em; color:var(--ink);
}
.chip{padding:6px 12px;font-size:11px;color:var(--dim)}
.act{padding:8px 14px;font-size:11.5px}
.act:hover:not(:disabled),.chip:hover{transform:translateY(-1px);border-color:var(--blue);color:var(--blue-d);
  box-shadow:inset 0 1px 0 #fff, 0 2px 3px rgba(15,48,85,.08), 0 6px 14px rgba(31,122,224,.16)}
.act:active:not(:disabled),.chip:active{transform:translateY(1px);
  box-shadow:inset 0 2px 4px rgba(15,48,85,.12)}
.act:disabled{opacity:.42;cursor:not-allowed;box-shadow:none;background:var(--tint)}
.act.primary{
  color:#fff; border-color:var(--blue-d);
  background:linear-gradient(180deg,var(--blue-l) 0%,var(--blue) 55%,var(--blue-d) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 2px 4px rgba(20,102,196,.26), 0 7px 18px rgba(31,122,224,.24);
}
.act.primary:hover:not(:disabled){color:#fff;border-color:var(--blue-d);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45), 0 3px 6px rgba(20,102,196,.3), 0 10px 24px rgba(31,122,224,.3)}

.hfit{display:flex;align-items:center;gap:8px}
.hfit>span{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--dim);
  text-transform:uppercase;white-space:nowrap}
.hseg{width:126px}
.hseg3{width:180px}
.seg button:active{background:#fff;transform:translateY(1px);
  box-shadow:inset 0 2px 3px rgba(15,48,85,.13)}
.hseg button{padding:6px 0;font-size:10.5px}

/* ───────── 본문 ───────── */
main{flex:1;display:flex;min-height:0}
.rail{flex:0 0 328px;overflow-y:auto;overflow-x:hidden;padding:11px 11px 18px}
.rail::-webkit-scrollbar{width:10px}
.rail::-webkit-scrollbar-track{background:transparent}
.rail::-webkit-scrollbar-thumb{background:#C4D9EF;border-radius:5px;border:3px solid var(--bg)}

.grp{background:var(--card);border:1px solid var(--line2);border-radius:var(--r);
     box-shadow:var(--sh1);margin-bottom:11px;overflow:hidden}
.grp>h3{display:flex;align-items:center;gap:9px;padding:12px 15px 10px;
  font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.15em;
  text-transform:uppercase;color:var(--blue-d)}
.grp>h3 i{flex:1;height:1px;background:var(--line2);font-style:normal}
.grp>h3 em{font-style:normal;font-size:9px;color:var(--dimmer);letter-spacing:.08em;text-transform:none}
.fields{padding:0 15px 14px;display:grid;grid-template-columns:1fr 1fr;gap:9px 11px}
.fields.one{grid-template-columns:1fr}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;color:var(--dim);
  text-transform:uppercase;display:flex;justify-content:space-between;gap:6px}
.f label em{font-style:normal;color:var(--dimmer);text-transform:none;letter-spacing:0}
.f input,.f select{
  background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:var(--r2);
  padding:7px 9px;font-family:var(--mono);font-size:12.5px;width:100%;
  font-variant-numeric:tabular-nums;
  box-shadow:inset 0 1px 2px rgba(15,48,85,.055);transition:.13s}
.f select{cursor:pointer}
.f input:focus,.f select:focus{outline:none;border-color:var(--blue);
  box-shadow:inset 0 1px 2px rgba(15,48,85,.04), 0 0 0 3px rgba(31,122,224,.15)}
.f input:hover,.f select:hover{border-color:#A8C8E8}

.seg{display:flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:var(--r2);
     background:var(--tint);box-shadow:inset 0 1px 2px rgba(15,48,85,.06)}
.seg button{flex:1;background:transparent;border:1px solid transparent;border-radius:var(--r3);
  padding:5px 0;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--dim)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--blue-d);border-color:var(--line);
  box-shadow:0 1px 2px rgba(15,48,85,.09)}

.note{margin:0 15px 14px;padding:10px 12px;background:var(--sky-l);border-radius:var(--r2);
      font-size:11.5px;color:#2E5A85;line-height:1.6}
.err{margin:0 0 10px;padding:11px 14px;font-size:11.5px;color:#fff;line-height:1.6;
     font-family:var(--mono);background:linear-gradient(180deg,#E4705F,var(--bad));
     border-radius:var(--r);box-shadow:var(--sh1)}
.err:empty{display:none}

.toggles{padding:0 15px 12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tg{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;
    letter-spacing:.03em;color:var(--dim);cursor:pointer;user-select:none}
.tg input{appearance:none;width:15px;height:15px;border:1px solid var(--line);border-radius:5px;
  background:#fff;cursor:pointer;flex:0 0 auto;position:relative;
  box-shadow:inset 0 1px 2px rgba(15,48,85,.07);transition:.13s}
.tg input:checked{background:var(--sw,var(--blue));border-color:var(--sw,var(--blue));
  box-shadow:0 1px 3px rgba(31,122,224,.35)}
.tg input:checked::after{content:"";position:absolute;left:4.5px;top:1.5px;width:3.5px;height:7.5px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg)}

/* ───────── 스테이지 ───────── */
.stage{flex:1;position:relative;min-width:0;display:flex;flex-direction:column;padding:11px 11px 11px 0;gap:11px}
.view{flex:1;position:relative;min-height:0;border-radius:var(--r);overflow:hidden;
  border:1px solid var(--line2);box-shadow:var(--sh1);
  background:
    repeating-linear-gradient(0deg,transparent 0 31px,rgba(31,122,224,.055) 31px 32px),
    repeating-linear-gradient(90deg,transparent 0 31px,rgba(31,122,224,.055) 31px 32px),
    radial-gradient(130% 105% at 50% 0%,#FFFFFF 0%,#EAF3FC 62%,#DDEBF9 100%);
}
canvas{display:block;position:absolute;top:0;left:0;width:100%;height:100%}
.hud{position:absolute;pointer-events:none;background:rgba(255,255,255,.82);
  backdrop-filter:blur(7px);border:1px solid var(--line2);border-radius:var(--r2);
  padding:8px 11px;box-shadow:var(--sh1);
  font-family:var(--mono);font-size:10px;letter-spacing:.07em;color:var(--dim);line-height:1.85}
.hud.tl{top:13px;left:13px;letter-spacing:.05em}
.hud.tr{top:13px;right:13px;text-align:right}
.hud.bl{bottom:13px;left:13px}
.hud b{color:var(--blue-d);font-weight:600}
.axis{position:absolute;right:16px;bottom:16px;width:78px;height:78px;pointer-events:none;
  background:rgba(255,255,255,.82);backdrop-filter:blur(7px);border:1px solid var(--line2);
  border-radius:var(--r2);box-shadow:var(--sh1)}

/* ───────── 존 스트립 ───────── */
.strip{flex:0 0 auto;background:var(--card);border:1px solid var(--line2);
       border-radius:var(--r);box-shadow:var(--sh1);padding:11px 15px 13px}
.strip .head{display:flex;align-items:baseline;gap:12px;margin-bottom:9px;flex-wrap:wrap}
.strip .head b{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.15em;
  text-transform:uppercase;color:var(--blue-d)}
.strip .head span{font-size:11px;color:var(--dim);font-family:var(--mono)}
.bar{display:flex;height:38px;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;
     box-shadow:inset 0 1px 3px rgba(15,48,85,.07)}
.zone{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;
  gap:1px;border-right:1px solid rgba(255,255,255,.85);min-width:0;overflow:hidden;
  transition:flex-grow .3s cubic-bezier(.4,0,.2,1)}
.zone:last-child{border-right:0}
.zone .zn{font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--ink);
  white-space:nowrap;text-overflow:ellipsis;overflow:hidden;max-width:94%}
.zone .zv{font-family:var(--mono);font-size:8.5px;color:var(--dim);white-space:nowrap}
.zone.up{background:linear-gradient(180deg,#DCEEFB,#C9E4F8)}
.zone.down{background:linear-gradient(180deg,#EAF4FC,#DCEBF7)}
.zone.ref{background:linear-gradient(180deg,#EFEAFC,#DFD5F8)}
.zone.bend{background:
  repeating-linear-gradient(-45deg,rgba(124,92,224,.24) 0 4px,transparent 4px 9px),
  linear-gradient(180deg,#E7E0FA,#D6C9F5)}
.refhead{margin-top:11px}
.refbar{height:30px}
.refoff{display:none}
.zone.core{background:
  repeating-linear-gradient(45deg,rgba(31,122,224,.20) 0 4px,transparent 4px 9px),
  linear-gradient(180deg,#FFF4EA,#FBE6D4)}
.ruler{display:flex;margin-top:5px;font-family:var(--mono);font-size:8.5px;color:var(--dimmer)}
.ruler span{flex:1;border-left:1px solid var(--line);padding-left:4px}
.ruler span:last-child{text-align:right;border-right:1px solid var(--line);padding-right:4px}

/* ───────── 토스트 ───────── */
.toast{position:fixed;right:18px;bottom:18px;z-index:60;width:380px;max-width:calc(100vw - 36px);
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:0 12px 36px rgba(15,48,85,.22);overflow:hidden}
.toast[hidden]{display:none}
.toast .thead{display:flex;align-items:center;gap:10px;padding:10px 13px;
  border-bottom:1px solid var(--line2);background:linear-gradient(180deg,#fff,#F4F9FE)}
.toast .thead b{flex:1;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--blue-d)}
.toast .thead button{border:0;background:transparent;color:var(--dim);font-size:13px;cursor:pointer}
.toast .tbody{padding:11px 13px;font-size:11.5px;line-height:1.7;max-height:46vh;overflow:auto}
.toast .tbody code{font-family:var(--mono);font-size:10.5px;background:var(--tint);
  padding:1px 5px;border-radius:4px}
.toast .tbody ul{margin:6px 0 0 16px}
.toast .tbody li{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.toast.bad{border-color:var(--bad)}
.toast.bad .thead{background:linear-gradient(180deg,#FDECEA,#FBDDD9)}
.toast.bad .thead b{color:#9E2B1E}

/* ───────── 회로 설계 모달 ───────── */
.modal{position:fixed;inset:0;background:rgba(10,35,60,.42);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;z-index:50;padding:22px}
.modal[hidden]{display:none}
.mcard{background:var(--card);border-radius:16px;box-shadow:0 18px 60px rgba(15,48,85,.30);
  width:min(1200px,100%);height:min(760px,100%);display:flex;flex-direction:column;overflow:hidden}
.mhead{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line2)}
.mhead>b{font-family:var(--mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--blue-d)}
.mhead>span{flex:1;font-size:11.5px;color:var(--dim);font-family:var(--mono)}
.mbody{display:flex;min-height:0;flex:1}
.mmap{flex:1;min-width:0;padding:10px;display:flex;align-items:center;justify-content:center;
  background:repeating-linear-gradient(0deg,transparent 0 23px,rgba(31,122,224,.05) 23px 24px),
             repeating-linear-gradient(90deg,transparent 0 23px,rgba(31,122,224,.05) 23px 24px),#FBFDFF}
.mside{flex:0 0 302px;border-left:1px solid var(--line2);padding:12px;overflow-y:auto;
  display:flex;flex-direction:column;gap:9px}
.lbl2{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--blue-d);border-bottom:1px solid var(--line2);padding-bottom:4px}
.cegen{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cegen .act{padding:6px 4px;font-size:10px}
.cetube{cursor:pointer}
.cenum{font-family:var(--mono);font-size:9px;text-anchor:middle;pointer-events:none;font-weight:500}
.ceax{font-family:var(--mono);font-size:9px;fill:var(--dimmer);letter-spacing:.08em}
.ceio{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em}
.cerow{display:flex;align-items:center;gap:7px;padding:5px 7px;border:1px solid var(--line2);
  border-radius:8px;font-size:11px;cursor:pointer;background:#fff}
.cerow.on{border-color:var(--blue);box-shadow:0 0 0 2px rgba(31,122,224,.13)}
.cerow i{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.cerow b{font-family:var(--mono);font-size:10.5px}
.cerow>span{color:var(--dim);font-size:10px}
.cerow>span.num{margin-left:auto}
.cerow button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:1px 5px;
  font-family:var(--mono);font-size:9.5px;color:var(--dim);cursor:pointer}
.cerow button:hover{border-color:var(--blue);color:var(--blue-d)}
.cerow .cerev{font-size:11px;line-height:1}
.cewarn{padding:9px 11px;border-radius:9px;font-family:var(--mono);font-size:10.5px;line-height:1.65}
.cewarn.ok{background:var(--sky-l);color:#2E5A85}
.cewarn.bad{background:#FDECEA;color:#9E2B1E}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:960px){
  main{flex-direction:column}
  .rail{flex:0 0 46vh;width:100%}
  .stage{padding:0 11px 11px}
}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
</style>
</head>
<body>

<header>
  <div class="brand"><b>FT-HX CFD STUDIO</b><span>3D 해석 전용 형상 설계</span></div>
  <div class="chips">
    <button class="chip" data-preset="evap">증발기 프리셋</button>
    <button class="chip" data-preset="cond">응축기 프리셋</button>
  </div>
  <div class="spacer"></div>
  <div class="hfit"><span>튜토리얼</span>
    <div class="seg hseg" id="tutSeg">
      <button data-preset="tutorial" title="관 1개 · 5 바디 — 메싱 첫 시험용">관 1개</button>
      <button data-preset="probe" title="관 3개 + 벤드 2개 · 13 바디">관 3개</button>
    </div></div>
  <button class="act" id="btnUpd" title="확인 중…">앱 업데이트</button>
  <button class="act" id="btnCirc">회로 설계</button>
  <div class="hfit"><span>뷰 맞춤</span>
    <div class="seg hseg" id="fitSeg">
      <button data-fit="core" aria-pressed="true">코어</button>
      <button data-fit="all" aria-pressed="false">전체</button>
    </div></div>
  <div class="hfit"><span>STL</span>
    <div class="seg hseg3" id="stlSeg">
      <button id="btnStlSolid">고체</button>
      <button id="btnStlAir">공기</button>
      <button id="btnStlRef">냉매</button>
    </div></div>
  <button class="act" id="btnStep" title="로컬 서버로 STEP 생성" disabled>STEP (서버)</button>
  <button class="act primary" id="btnJson">case.json</button>
</header>

<main>
  <aside class="rail" id="rail"></aside>

  <section class="stage">
    <div class="view" id="view">
      <canvas id="cv"></canvas>
      <div class="hud tl">드래그 회전 · 휠 확대 · Shift+드래그 이동</div>
      <div class="hud tr" id="hudR"></div>
      <div class="hud bl" id="hudL"></div>
      <svg class="axis" viewBox="0 0 78 78" id="axis"></svg>
    </div>

    <div class="strip">
      <div class="head">
        <b>유동 도메인 존 구성</b>
        <span id="zoneSummary"></span>
      </div>
      <div class="bar" id="zoneBar"></div>
      <div class="ruler" id="zoneRuler"></div>
      <div class="head refhead" id="refHead">
        <b>냉매 도메인</b><span id="refSummary"></span>
      </div>
      <div class="bar refbar" id="refBar"></div>
    </div>
  </section>
</main>

<div class="toast" id="toast" hidden>
  <div class="thead"><b id="tTitle"></b><button id="tClose">✕</button></div>
  <div class="tbody" id="tBody"></div>
</div>

<div class="modal" id="ceModal" hidden>
 <div class="mcard">
  <div class="mhead"><b>회로 설계</b><span id="ceStat"></span>
    <button class="act" id="ceClose">닫기</button></div>
  <div class="mbody">
   <div class="mmap"><svg id="ceSvg"></svg></div>
   <div class="mside">
    <div class="lbl2">자동 생성</div>
    <div class="cegen">
      <button class="act" data-gen="single">단일 회로</button>
      <button class="act" data-gen="row_serpentine">열별 사행</button>
      <button class="act" data-gen="face_split">전면 N분할</button>
      <button class="act" data-gen="interlaced">인터레이스드 N</button>
    </div>
    <div class="f"><label>회로 수 N<em>분할·인터레이스드</em></label>
      <input type="number" id="ceN" min="1" step="1" value="4"></div>
    <div class="lbl2">회로 <span style="float:right;text-transform:none;letter-spacing:0;
      color:var(--dimmer)">관 클릭·드래그로 경로 지정</span></div>
    <div id="ceList" style="display:flex;flex-direction:column;gap:5px"></div>
    <div class="cegen">
      <button class="act" id="ceAdd">+ 회로 추가</button>
      <button class="act" id="ceRevAll">⇄ 전체 방향 반전</button>
    </div>
    <div class="lbl2">검증</div>
    <div class="cewarn ok" id="ceWarn"></div>
   </div>
  </div>
 </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

/* =========================================================================
   1. 파라미터 모델 —  fthx_params.py (FTHXParams) 와 동일 스키마
   ========================================================================= */
const P = {
  name:"fthx_case",
  // 관
  Do:9.52, Di:8.22, L:500, Nr:4, Nt:12, Pt:25.4, Pl:22.0, layout:"staggered",
  // 핀
  FPI:14, t_f:0.115, fin_type:"plain", L_fin:500, edge_y:12.7, gap_y:0, gap_z:0, R_over_D:0, bend_leg:0,
  // 도메인
  L_up:100, L_down:200, autoExt:true,
  include_bends:true, include_tube_fluid:true, split_core_by_row:true,
  // 메시 추정
  h_base:2.0, n_prism:5,
  // 표시
  finDensity:4, N_d:10, port_stub:0,
  V_face:2.0, T_air:27, RH_air:50,
  ref_fluid:"R410A", ref_mode:"evaporator", m_total:0.030, T_sat:7,
  thermal:"equilibrium",
  show:{tube:true, fin:true, bend:true, air:true, core:true, ref:true, byp:true}
};

const PRESETS = {
  evap:{Do:9.52,Di:8.22,L:500,L_fin:470,edge_y:12.7,gap_y:4,gap_z:5,Nr:2,Nt:14,Pt:25.4,Pl:22.0,FPI:10,t_f:0.115,layout:"staggered",fin_type:"louver"},
  cond:{Do:7.94,Di:7.10,L:600,L_fin:560,edge_y:10.5,gap_y:3,gap_z:4,Nr:4,Nt:16,Pt:21.0,Pl:18.2,FPI:18,t_f:0.100,layout:"staggered",fin_type:"wavy"}
};

/* ---------- 형상 배치 ---------- */
const centers = () => {
  const out=[];
  for(let r=0;r<P.Nr;r++){
    const x = P.Pl/2 + r*P.Pl;
    const off = (P.layout==="staggered" && r%2===1) ? P.Pt/2 : 0;
    for(let i=0;i<P.Nt;i++) out.push({r,i,x,y:P.Pt/2 + i*P.Pt + off});
  }
  return out;
};
/* 핀 팩(= 포러스 코어) 범위. 관 배열과 독립 */
const bbox = () => {
  const ys = centers().map(c=>c.y);
  const Lf = Math.min(P.L_fin||P.L, P.L), e = P.edge_y || P.Pt/2, zc = P.L/2;
  return {x0:0, x1:P.Nr*P.Pl, y0:Math.min(...ys)-e, y1:Math.max(...ys)+e,
          z0:zc-Lf/2, z1:zc+Lf/2};
};
const tubeZ = () => [0, P.L];          // 벤드가 붙는 곳
/* 공기 도메인 단면 = 핀 팩 + 간극 */
const duct = () => { const b=bbox(), gy=P.gap_y||0, gz=P.gap_z||0;
  return {x0:b.x0,x1:b.x1,y0:b.y0-gy,y1:b.y1+gy,z0:b.z0-gz,z1:b.z1+gz,
          sealed:(gy<=0&&gz<=0)}; };

/* ---------- 검증 ---------- */
function validate(){
  const e=[];
  if(P.Di>=P.Do) e.push("Di ≥ Do — 관 두께 없음");
  if(P.Pt<=P.Do) e.push("Pt ≤ Do — 횡방향 간섭");
  if(P.Pl<=P.Do) e.push("Pl ≤ Do — 종방향 간섭");
  if(P.layout==="staggered" && Math.hypot(P.Pl,P.Pt/2)<=P.Do) e.push("대각 피치 ≤ Do — 엇갈림 배열 간섭");
  if((P.L_fin||P.L) > P.L) e.push("L_fin > 관 길이");
  if((P.edge_y||P.Pt/2) <= P.Do/2) e.push("edge_y ≤ Do/2 — 핀이 관을 못 덮음");
  {const k=duct(); if(k.z0<-1e-9||k.z1>P.L+1e-9) e.push("덕트가 관 길이를 벗어남 — gap_z 축소");}
  const Fp = 25.4/P.FPI;
  if(P.t_f>=Fp) e.push(`t_f ≥ Fp(${Fp.toFixed(3)}) — 핀 겹침`);
  return e;
}

/* ---------- 파생량 (Wang 정의, fthx_params.derived() 와 동일) ---------- */
function derived(){
  const b=bbox(), Fp=25.4/P.FPI;
  const W=b.x1-b.x0, H=b.y1-b.y0, L=b.z1-b.z0;   // L = 핀 팩 길이
  const n=P.Nr*P.Nt, Nf=Math.floor(L/Fp);
  const Dc=P.Do+2*P.t_f;                          // 핀 칼라 = 공기측 특성 직경
  const A_front=H*L;
  const A_c=(H-P.Nt*Dc)*(L-Nf*P.t_f);
  const A_tube=n*Math.PI*Dc*(L-Nf*P.t_f);
  const A_fin=2*Nf*(W*H - n*Math.PI*Dc**2/4);
  const A_o=A_tube+A_fin;
  // 존 체적은 CAD 가 Do 로 잘라내므로 Do 기준 유지
  const V_box=W*H*L, V_tube=n*Math.PI*P.Do**2/4*L, V_zone=V_box-V_tube;
  const V_fin=Nf*P.t_f*(W*H - n*Math.PI*Dc**2/4)
            + n*Math.PI*(Dc*Dc-P.Do*P.Do)/4*L;    // 플레이트 + 칼라
  return {Fp, N_fin:Nf, W,H,L, n_tube:n, D_c:Dc,
    A_front, A_min:A_c, sigma:A_c/A_front, A_o, A_fin_frac:A_fin/A_o,
    D_h:4*A_c*W/A_o, V_zone, gamma:1-V_fin/V_zone, a_v:(A_o/V_zone)*1000,
    Ao_Ac:A_o/A_c, ...bypassMetrics(H,L)};
}

/* ---------- 냉매 도메인 (관내 실형상 해상) ---------- */
function refDerived(){
  const A=Math.PI*P.Di*P.Di/4, TZ=tubeZ(), Ls=TZ[1]-TZ[0];  // 냉매는 관 전장
  const nStr=nTube(), bends=CIRC.bends;
  const V_str=nStr*Ls*A;
  const V_bend=bends.reduce((s,b)=>s+pathLen(b)*A,0);
  const h=P.Di/Math.max(4,P.N_d);
  return {A, Ls, nCirc:CIRC.list.length, nStr, nBend:bends.length,
          V_str, V_bend, V_tot:V_str+V_bend,
          path:CIRC.rep.path_mean_mm||0, spread:CIRC.rep.path_spread_pct||0, h,
          cells_str:V_str/h**3, cells_bend:V_bend/h**3, cells:(V_str+V_bend)/h**3};
}

function bypassMetrics(H,L){
  const k=duct(), Hd=k.y1-k.y0, Ld=k.z1-k.z0, Ad=Hd*Ld, Ab=Ad-H*L;
  const o={duct_H:Hd, duct_L:Ld, A_duct:Ad, A_bypass:Ab,
           bypass_frac:Ad>0?Ab/Ad:0, sealed:k.sealed};
  if((P.gap_y||0)>0) o.Dh_by_y=4*(P.gap_y*L)/(2*(P.gap_y+L));
  if((P.gap_z||0)>0) o.Dh_by_z=4*(P.gap_z*H)/(2*(P.gap_z+H));
  return o;
}

/* ---------- 유동 도메인 자동 산정 ---------- */
function autoExtents(){
  const b=bbox(), W=b.x1-b.x0;
  return {up:Math.max(60, Math.round(1.5*W)), down:Math.max(150, Math.round(5*W))};
}
function zones(){
  const b=bbox(), d=derived(), H=d.H, L=d.L, h=Math.max(.2,P.h_base);
  const cell = (dx)=> Math.round(dx*H*L/(h**3));
  const z=[{k:"up", name:"fluid_air_up", dx:P.L_up}];
  if(P.split_core_by_row) for(let r=0;r<P.Nr;r++)
      z.push({k:"core", name:`fluid_air_core_r${String(r+1).padStart(2,"0")}`, dx:P.Pl});
  else z.push({k:"core", name:"fluid_air_core", dx:b.x1-b.x0});
  z.push({k:"down", name:"fluid_air_down", dx:P.L_down});
  z.forEach(o=>{ o.cells = cell(o.dx) * (o.k==="core" ? d.gamma : 1); });
  const A_wall = d.n_tube*Math.PI*P.Do*L;
  const prism = Math.round(A_wall/(h*h))*P.n_prism;
  return {list:z, prism, total:z.reduce((s,o)=>s+o.cells,0)+prism};
}

/* =========================================================================
   회로 설계 엔진 — circuits.py 이식 (스키마 · 생성기 · 위상/간섭 검증)
   ========================================================================= */
const PALETTE=["#1F7AE0","#E0663F","#2FA36B","#7C5CE0","#D89A2B",
               "#0FA3B1","#C4457E","#6B8F1E","#8A5A2B","#4B5EAA",
               "#B0413E","#2B8C6A"];
const CIRC={pattern:"row_serpentine", nc:4, list:[], bends:[], ports:[],
            rep:{warnings:[],standoff:{},summary:{}}, active:0};

const nTube = ()=>P.Nr*P.Nt;
const tidOf = (r,i)=>r*P.Nt+i;
const rcOf  = t=>[Math.floor(t/P.Nt), t%P.Nt];
const cColor= idx=>PALETTE[idx%PALETTE.length];
function XY(){ const a=new Array(nTube());
  centers().forEach(c=>a[tidOf(c.r,c.i)]={x:c.x,y:c.y}); return a; }

/* ---------- 자동 생성기 ---------- */
const bou=(a,f)=>f?a.slice().reverse():a.slice();
const mkC=(n,tubes)=>({id:"c"+String(n).padStart(2,"0"),tubes,inlet_end:"z0",m_frac:null});
function rangeArr(a,b){const o=[];for(let i=a;i<b;i++)o.push(i);return o;}

function genSingle(){
  let t=[]; for(let j=0,r=P.Nr-1;r>=0;r--,j++) t=t.concat(bou(rangeArr(0,P.Nt),j%2===1).map(i=>tidOf(r,i)));
  return [mkC(1,t)];
}
function genRowSerp(){
  return rangeArr(0,P.Nr).map(r=>mkC(r+1, rangeArr(0,P.Nt).map(i=>tidOf(r,i))));
}
function genFaceSplit(n){
  n=Math.max(1,Math.min(n,P.Nt)); const out=[];
  const e=rangeArr(0,n+1).map(c=>Math.round(P.Nt*c/n));
  for(let c=0;c<n;c++){
    const band=rangeArr(e[c],e[c+1]); let t=[];
    for(let j=0,r=P.Nr-1;r>=0;r--,j++) t=t.concat(bou(band,j%2===1).map(i=>tidOf(r,i)));
    out.push(mkC(c+1,t));
  }
  return out;
}
function genInterlaced(n){
  n=Math.max(1,Math.min(n,P.Nt)); const out=[];
  for(let c=0;c<n;c++){
    const band=[]; for(let i=c;i<P.Nt;i+=n) band.push(i);
    let t=[]; for(let j=0,r=P.Nr-1;r>=0;r--,j++) t=t.concat(bou(band,j%2===1).map(i=>tidOf(r,i)));
    out.push(mkC(c+1,t));
  }
  return out;
}
function genNone(){ return rangeArr(0,nTube()).map(t=>mkC(t+1,[t])); }

const GENS={single:genSingle,row_serpentine:genRowSerp,none:genNone,
            face_split:()=>genFaceSplit(CIRC.nc),interlaced:()=>genInterlaced(CIRC.nc)};

function regenCircuits(){
  CIRC.list = (GENS[CIRC.pattern]||genRowSerp)();
  CIRC.active=0; analyzeCircuits();
}
/* 관 수가 바뀌면 커스텀 회로는 유지 불가 → 안전하게 재생성 */
function reconcileCircuits(){
  const N=nTube();
  const bad = CIRC.list.length===0 ||
              CIRC.list.some(c=>c.tubes.some(t=>t>=N));
  if(CIRC.pattern!=="custom" || bad) regenCircuits(); else analyzeCircuits();
}

/* ---------- 벤드 도출 ---------- */
function deriveBends(){
  if(!P.include_bends) return [];
  const xy=XY(), out=[];
  CIRC.list.forEach(ck=>{
    for(let k=1;k<ck.tubes.length;k++){
      const a=ck.tubes[k-1], b=ck.tubes[k];
      if(xy[a]===undefined||xy[b]===undefined) continue;
      const odd=(k%2===1);
      const end = ck.inlet_end==="z0" ? (odd?"z1":"z0") : (odd?"z0":"z1");
      const dx=xy[b].x-xy[a].x, dy=xy[b].y-xy[a].y, span=Math.hypot(dx,dy);
      const R=(P.R_over_D>0)?Math.min(P.R_over_D*P.Do,span/2):span/2;
      out.push({c:ck.id,k,a,b,end,R,span,th:Math.atan2(dy,dx),
                leg:P.bend_leg||0, straight:span-2*R,
                cx:(xy[a].x+xy[b].x)/2, cy:(xy[a].y+xy[b].y)/2,
                standoff:0, level:0, bad:false});
    }
  });
  return out;
}
/* 스텁 + 반원 호 + 스텁 폴리라인 (flat [x,y,z,...]) */
function straightTotal(bd){ return (bd.leg||0)+bd.standoff; }
function protrusion(bd){ return straightTotal(bd)+bd.R; }
function pathLen(bd){ return 2*straightTotal(bd)+Math.PI*bd.R+(bd.straight||0); }
/* 국소 (u,v) → 전역. 다리 → 90°원호 → 직선 → 90°원호 → 다리 */
function bendPoly(bd,nArc){
  nArc=nArc||13;
  const TZ=tubeZ(), s=bd.end==="z1"?1:-1, ze=bd.end==="z1"?TZ[1]:TZ[0];
  const S=bd.span, R=bd.R, T=straightTotal(bd), St=bd.straight||0;
  const ct=Math.cos(bd.th), st=Math.sin(bd.th), uv=[];
  const ns=T>1e-9?Math.max(2,Math.ceil(T/2)+2):0;
  for(let j=0;j<ns;j++) uv.push([-S/2, T*j/(ns-1)]);
  for(let j=0;j<nArc;j++){ const a=Math.PI*(1-0.5*j/(nArc-1));
    uv.push([-S/2+R+R*Math.cos(a), T+R*Math.sin(a)]); }
  if(St>1e-9) for(let j=1;j<=4;j++) uv.push([-S/2+R+St*j/4, T+R]);
  for(let j=0;j<nArc;j++){ const a=Math.PI/2*(1-j/(nArc-1));
    uv.push([S/2-R+R*Math.cos(a), T+R*Math.sin(a)]); }
  for(let j=0;j<ns;j++) uv.push([S/2, T*(1-j/(ns-1))]);
  const p=[];
  uv.forEach(([u,v])=>p.push(bd.cx+u*ct, bd.cy+u*st, ze+s*v));
  return p;
}
function minDist3(p,q){
  let m=Infinity;
  for(let i=0;i<p.length;i+=3) for(let j=0;j<q.length;j+=3){
    const dx=p[i]-q[j], dy=p[i+1]-q[j+1], dz=p[i+2]-q[j+2];
    const d=dx*dx+dy*dy+dz*dz; if(d<m) m=d;
  }
  return Math.sqrt(m);
}
/* 2D 현(chord) 간 최소거리 — 값싼 사전 배제용 */
function segDist2(a1,a2,b1,b2){
  const f=(p,q,r)=>{ const vx=r.x-q.x, vy=r.y-q.y, L=vx*vx+vy*vy;
    let t=L?((p.x-q.x)*vx+(p.y-q.y)*vy)/L:0; t=Math.max(0,Math.min(1,t));
    return Math.hypot(p.x-(q.x+t*vx), p.y-(q.y+t*vy)); };
  return Math.min(f(a1,b1,b2),f(a2,b1,b2),f(b1,a1,a2),f(b2,a1,a2));
}

/* ---------- 간섭 · 스탠드오프 ---------- */
function resolveStandoff(bends){
  const step=P.Do*1.6, maxSo=3*P.Pt, nLv=Math.max(1,Math.floor(maxSo/step));
  const thr=P.Do+1.0, xy=XY(), placed={z0:[],z1:[]};
  const cross=[]; let resolved=0;
  const near=(bd,o)=>segDist2(xy[bd.a],xy[bd.b],xy[o.a],xy[o.b]) < bd.R+o.R+thr;

  bends.slice().sort((u,v)=>v.R-u.R).forEach(bd=>{
    bd.bad=false; let hit=[];
    for(let lv=0; lv<=nLv; lv++){
      bd.level=lv; bd.standoff=lv*step;
      const poly=bendPoly(bd);
      hit=placed[bd.end].filter(o=>near(bd,o.bd)&&minDist3(poly,o.poly)<thr)
                        .map(o=>o.bd.c+"#"+o.bd.k);
      if(!hit.length){ if(lv>0) resolved++;
        placed[bd.end].push({bd,poly}); return; }
    }
    bd.level=0; bd.standoff=0; bd.bad=true;
    cross.push({bend:bd.c+"#"+bd.k, end:bd.end, span:+bd.span.toFixed(1), with:hit});
    placed[bd.end].push({bd,poly:bendPoly(bd)});
  });
  return {step_mm:+step.toFixed(2), max_standoff_mm:+maxSo.toFixed(1),
          max_level:bends.reduce((m,b)=>Math.max(m,b.level),0),
          n_resolved:resolved, n_crossing:cross.length, crossings:cross.slice(0,10),
          max_protrusion_mm:+bends.reduce((m,b)=>Math.max(m,protrusion(b)),0).toFixed(1)};
}

/* ---------- 위상 검증 ---------- */
function validateCircuits(bends){
  const N=nTube(), seen={}, msgs=[];
  CIRC.list.forEach(ck=>{
    if(new Set(ck.tubes).size!==ck.tubes.length) msgs.push(`${ck.id}: 같은 관을 두 번 지나감`);
    ck.tubes.forEach(t=>{
      if(t<0||t>=N) msgs.push(`${ck.id}: 관 id ${t} 범위 밖`);
      else if(seen[t]!==undefined) msgs.push(`관 ${JSON.stringify(rcOf(t))} 이 ${seen[t]}·${ck.id} 에 중복`);
      else seen[t]=ck.id;
    });
  });
  const miss=[]; for(let t=0;t<N;t++) if(seen[t]===undefined) miss.push(t);
  if(miss.length) msgs.push(`미배정 관 ${miss.length}개`);
  const lim=2.5*Math.max(P.Pt,P.Pl);
  bends.forEach(b=>{
    if(b.span>lim) msgs.push(`${b.c}#${b.k} span ${b.span.toFixed(1)}mm > 한계 ${lim.toFixed(1)}mm`);
    if(b.span<P.Do) msgs.push(`${b.c}#${b.k} span ${b.span.toFixed(1)}mm < Do — 형상 불가`);
  });
  return {msgs, miss};
}

/* 관 하나를 지날 때마다 끝단이 뒤집힘 → n 개면 n 번.
   벤드 수(n-1) 로 판정하면 단일 관에서 입·출구가 같은 면이 되어 모순 */
const outletEnd=(ie,n)=> (n%2===0) ? ie : (ie==="z0"?"z1":"z0");

/* 유동 방향 반전 — 관 순서를 역으로 하고 입구 끝단을 기존 출구 끝단으로.
   벤드 형상은 완전히 동일하고 입출구만 맞바뀜 */
function reverseCircuit(ck){
  return {id:ck.id, tubes:ck.tubes.slice().reverse(),
          inlet_end:outletEnd(ck.inlet_end, ck.tubes.length), m_frac:ck.m_frac};
}

/* ---------- 입출구 포트 ---------- */
function ioPorts(){
  const xy=XY(), B0=bbox(), out=[];
  CIRC.list.forEach(ck=>{
    const n=ck.tubes.length, ie=ck.inlet_end, oe=outletEnd(ie,n);
    [["inlet",ck.tubes[0],ie],["outlet",ck.tubes[n-1],oe]].forEach(([kind,t,e])=>{
      const TZ=tubeZ(), ps=P.port_stub||0;
      if(xy[t]) out.push({name:`ref_${kind}_${ck.id}`, circuit:ck.id, kind, tube:t,
        rc:rcOf(t), end:e, seed:[xy[t].x, xy[t].y, e==="z0"?TZ[0]-ps:TZ[1]+ps]});
    });
  });
  return out;
}

/* ---------- 통합 ---------- */
function analyzeCircuits(){
  const bends=deriveBends();
  const so=resolveStandoff(bends);
  const v=validateCircuits(bends);
  const TZ=tubeZ(), Ls=TZ[1]-TZ[0], A=Math.PI*P.Di*P.Di/4;
  const rows=CIRC.list.map((ck,idx)=>{
    const bs=bends.filter(b=>b.c===ck.id);
    const path=ck.tubes.length*Ls + bs.reduce((s,b)=>s+pathLen(b),0);
    return {id:ck.id, color:cColor(idx), n_tube:ck.tubes.length, n_bend:bs.length,
            path_mm:path, V_mm3:path*A,
            rows_touched:[...new Set(ck.tubes.map(t=>rcOf(t)[0]))].sort()};
  });
  const L=rows.map(r=>r.path_mm), mean=L.reduce((a,b)=>a+b,0)/(L.length||1);
  CIRC.bends=bends; CIRC.ports=ioPorts();
  CIRC.rep={warnings:v.msgs, missing:v.miss, standoff:so, circuits:rows,
    path_mean_mm:mean, path_spread_pct:L.length?(Math.max(...L)-Math.min(...L))/mean*100:0,
    V_total_cm3:rows.reduce((s,r)=>s+r.V_mm3,0)/1000,
    ok:v.msgs.length===0 && so.n_crossing===0};
}

/* =========================================================================
   회로 맵 에디터 (SVG) — 가로 = 단(i), 세로 = 열(r, 공기 흐름 ↓)
   ========================================================================= */
let ceDrag=false, ceLast=-1;
function ceOpen(){ document.getElementById("ceModal").hidden=false; ceRender(); }
function ceClose(){ document.getElementById("ceModal").hidden=true; }

function ceRender(){
  const svg=document.getElementById("ceSvg"), box=svg.parentElement.getBoundingClientRect();
  const W=Math.max(360,box.width-24), H=Math.max(220,box.height-24);
  const xy=XY(), B0=bbox();
  const pad=26, sx=v=>pad+(v-B0.y0)/(B0.y1-B0.y0)*(W-2*pad),
                sy=v=>pad+(v-B0.x0)/(B0.x1-B0.x0)*(H-2*pad);
  const rad=Math.max(6,Math.min(16,(W-2*pad)/P.Nt*0.30,(H-2*pad)/P.Nr*0.34));
  const own={}; CIRC.list.forEach((c,ix)=>c.tubes.forEach((t,k)=>own[t]={ix,k,id:c.id}));

  let s=`<rect x="0" y="0" width="${W}" height="${H}" fill="none"/>`;
  s+=`<defs><marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5"
        orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="currentColor"/></marker></defs>`;
  s+=`<text x="${pad-14}" y="${pad-10}" class="ceax">단 i →</text>`;
  s+=`<text x="${pad-14}" y="${H-6}" class="ceax">공기 ↓ (열 r)</text>`;

  // 연결선
  CIRC.bends.forEach(b=>{
    const col=b.bad?"#DC5B4C":cColor(CIRC.list.findIndex(c=>c.id===b.c));
    const x1=sx(xy[b.a].y), y1=sy(xy[b.a].x), x2=sx(xy[b.b].y), y2=sy(xy[b.b].x);
    const mx=(x1+x2)/2, my=(y1+y2)/2, nx=-(y2-y1), ny=(x2-x1);
    const nl=Math.hypot(nx,ny)||1, off=(b.end==="z1"?1:-1)*Math.min(16,nl*0.16);
    s+=`<path d="M${x1},${y1} Q${mx+nx/nl*off},${my+ny/nl*off} ${x2},${y2}"
         fill="none" stroke="${col}" stroke-width="${b.bad?3.2:2}"
         ${b.bad?'stroke-dasharray="5 3"':''} opacity=".9"/>`;
    s+=`<circle cx="${mx+nx/nl*off*0.5}" cy="${my+ny/nl*off*0.5}" r="2.6"
         fill="${b.end==="z1"?col:"#fff"}" stroke="${col}" stroke-width="1.2"/>`;
  });
  // 입출구
  CIRC.ports.forEach(p0=>{
    const ix=CIRC.list.findIndex(c=>c.id===p0.circuit), col=cColor(ix);
    const X=sx(xy[p0.tube].y), Y=sy(xy[p0.tube].x), d=p0.kind==="inlet"?-1:1;
    s+=`<g color="${col}"><line x1="${X+d*rad*2.1}" y1="${Y}" x2="${X+d*rad*1.15}" y2="${Y}"
        stroke="${col}" stroke-width="1.8" marker-end="${p0.kind==="inlet"?'url(#ah)':''}"/>
        <text x="${X+d*rad*2.6}" y="${Y+3}" class="ceio" fill="${col}"
        text-anchor="${p0.kind==="inlet"?'end':'start'}">${p0.kind==="inlet"?"IN":"OUT"}</text></g>`;
  });
  // 관
  for(let r=0;r<P.Nr;r++) for(let i=0;i<P.Nt;i++){
    const t=tidOf(r,i), o=own[t], col=o?cColor(o.ix):"#C9DDF2";
    const X=sx(xy[t].y), Y=sy(xy[t].x), act=o&&o.ix===CIRC.active;
    s+=`<circle class="cetube" data-t="${t}" cx="${X}" cy="${Y}" r="${rad}"
         fill="${o?col:"#fff"}" fill-opacity="${o?(act?.95:.42):1}"
         stroke="${o?col:"#C9DDF2"}" stroke-width="${act?2.4:1.4}"/>`;
    if(o) s+=`<text x="${X}" y="${Y+3.2}" class="cenum"
         fill="${act?"#fff":col}">${o.k+1}</text>`;
  }
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  svg.setAttribute("width",W); svg.setAttribute("height",H);
  svg.innerHTML=s;
  svg.querySelectorAll(".cetube").forEach(n=>{
    n.onpointerdown=e=>{const t=+n.dataset.t; ceDrag=true; ceLast=t; cePick(t); e.preventDefault();};
    n.onpointerenter=()=>{ const t=+n.dataset.t;      // 같은 관 재진입은 무시
      if(ceDrag && t!==ceLast){ ceLast=t; cePick(t,true); } };
  });
  ceSide();
}
addEventListener("pointerup",()=>{ceDrag=false; ceLast=-1;});

function cePick(t,dragging){
  const cur=CIRC.list[CIRC.active]; if(!cur) return;
  const holder=CIRC.list.findIndex(c=>c.tubes.includes(t));
  if(holder>=0 && holder!==CIRC.active){ if(!dragging){CIRC.active=holder; ceRender();} return; }
  const at=cur.tubes.indexOf(t);
  if(at>=0){ if(!dragging && at===cur.tubes.length-1) cur.tubes.pop(); else return; }
  else cur.tubes.push(t);
  CIRC.pattern="custom"; analyzeCircuits(); ceRender(); refresh(true);
}

function ceSide(){
  const R=CIRC.rep, so=R.standoff;
  document.getElementById("ceStat").innerHTML =
    R.ok ? `<b style="color:var(--ok)">검증 통과</b> · 회로 ${CIRC.list.length}개 · `
           +`유로 평균 ${fmt(R.path_mean_mm,0)}mm · 편차 ${R.path_spread_pct.toFixed(1)}%`
         : `<b style="color:var(--bad)">불가</b> · 경고 ${R.warnings.length}건 · 구조적 교차 ${so.n_crossing}건`;

  document.getElementById("ceList").innerHTML = R.circuits.map((c,ix)=>`
    <div class="cerow ${ix===CIRC.active?'on':''}" data-ix="${ix}">
      <i style="background:${c.color}"></i>
      <b>${c.id}</b>
      <span>관 ${c.n_tube} · 벤드 ${c.n_bend}</span>
      <span class="num">${fmt(c.path_mm,0)}mm</span>
      <button class="cerev" data-ix="${ix}" title="유동 방향 반전">⇄</button>
      <button class="cein" data-ix="${ix}" title="입구 끝단">${CIRC.list[ix].inlet_end}</button>
      <button class="cedel" data-ix="${ix}" title="삭제">×</button>
    </div>`).join("");
  document.querySelectorAll(".cerow").forEach(n=>n.onclick=e=>{
    if(e.target.closest("button"))return; CIRC.active=+n.dataset.ix; ceRender();});
  document.querySelectorAll(".cein").forEach(n=>n.onclick=()=>{
    const c=CIRC.list[+n.dataset.ix]; c.inlet_end=c.inlet_end==="z0"?"z1":"z0";
    CIRC.pattern="custom"; analyzeCircuits(); ceRender(); refresh(true);});
  document.querySelectorAll(".cerev").forEach(n=>n.onclick=()=>{
    const i=+n.dataset.ix; CIRC.list[i]=reverseCircuit(CIRC.list[i]);
    CIRC.pattern="custom"; analyzeCircuits(); ceRender(); refresh(true);});
  document.querySelectorAll(".cedel").forEach(n=>n.onclick=()=>{
    CIRC.list.splice(+n.dataset.ix,1); CIRC.active=0; CIRC.pattern="custom";
    analyzeCircuits(); ceRender(); refresh(true);});

  const w=[]; R.warnings.slice(0,6).forEach(m=>w.push(`⚠ ${m}`));
  so.crossings.forEach(c=>w.push(`✗ 구조적 교차 ${c.bend} (${c.end}, span ${c.span}mm) ↔ ${c.with.join(", ")}`));
  document.getElementById("ceWarn").innerHTML =
    w.length ? w.join("<br>") : "문제 없음. 스탠드오프 해소 "+so.n_resolved+"건, 최대 돌출 "+so.max_protrusion_mm+"mm";
  document.getElementById("ceWarn").className = w.length?"cewarn bad":"cewarn ok";
}

function clearGroup(g){
  while(g.children.length){
    const c=g.children.pop();
    if(c.geometry) c.geometry.dispose();
    g.remove(c);
  }
}
function boxMesh(x0,x1,y0,y1,z0,z1,mat,emat){
  const g=new THREE.BoxGeometry(x1-x0,y1-y0,z1-z0);
  const m=new THREE.Mesh(g,mat);
  m.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2);
  const e=new THREE.LineSegments(new THREE.EdgesGeometry(g),emat);
  e.position.copy(m.position);
  return [m,e];
}

function rebuild(){
  reconcileCircuits();
  Object.values(G).forEach(clearGroup);
  const b=bbox(), C=centers(), d=derived(), xy=XY(), TZ0=tubeZ();
  const ext = 0;
  const zLen = (b.z1-b.z0) + 2*ext;

  // --- 관 ---
  const zLenT=(TZ0[1]-TZ0[0])+2*ext;
  const tg=new THREE.CylinderGeometry(P.Do/2,P.Do/2,zLenT,26,1,false);
  tg.rotateX(Math.PI/2);
  const im=new THREE.InstancedMesh(tg,M.copper,C.length);
  const mtx=new THREE.Matrix4();
  const TZ=tubeZ();
  C.forEach((c,i)=>{ mtx.makeTranslation(c.x,c.y,(TZ[0]+TZ[1])/2); im.setMatrixAt(i,mtx); });
  im.instanceMatrix.needsUpdate=true; G.tube.add(im);

  // --- 핀 (표시 전용) ---
  if(P.finDensity>0){
    const shp=new THREE.Shape();
    shp.moveTo(b.x0,b.y0); shp.lineTo(b.x1,b.y0); shp.lineTo(b.x1,b.y1); shp.lineTo(b.x0,b.y1); shp.closePath();
    C.forEach(c=>{ const h=new THREE.Path(); h.absarc(c.x,c.y,P.Do/2,0,Math.PI*2,true); shp.holes.push(h); });
    const fg=new THREE.ExtrudeGeometry(shp,{depth:P.t_f,bevelEnabled:false,curveSegments:14});
    const nShow=Math.max(1,Math.floor(d.N_fin/P.finDensity));
    const fim=new THREE.InstancedMesh(fg,M.alum,nShow);
    const step=(b.z1-b.z0)/nShow;
    for(let i=0;i<nShow;i++){ mtx.makeTranslation(0,0,b.z0+step*(i+.5)); fim.setMatrixAt(i,mtx); }
    fim.instanceMatrix.needsUpdate=true; G.fin.add(fim);
  }

  // --- 냉매 도메인: 직관부 ---
  if(P.include_tube_fluid){
    const rg=new THREE.CylinderGeometry(P.Di/2,P.Di/2,zLenT,22,1,false);
    rg.rotateX(Math.PI/2);
    const rim=new THREE.InstancedMesh(rg,M.ref,C.length);
    C.forEach((c,i)=>{ mtx.makeTranslation(c.x,c.y,(TZ0[0]+TZ0[1])/2); rim.setMatrixAt(i,mtx); });
    rim.instanceMatrix.needsUpdate=true; G.ref.add(rim);
  }

  // --- 리턴 벤드 (회로 기반, 임의 관 쌍) ---
  CIRC.bends.forEach(bd=>{
    const pts=[]; const fp=bendPoly(bd,20);
    for(let i=0;i<fp.length;i+=3) pts.push(new THREE.Vector3(fp[i],fp[i+1],fp[i+2]));
    const curve=new THREE.CatmullRomCurve3(pts);
    const put=(rad,mat,grp)=>{
      grp.add(new THREE.Mesh(new THREE.TubeGeometry(curve,Math.max(24,pts.length),rad,14,false),mat));
    };
    put(P.Do/2, bd.bad?M.badBend:M.copper, G.bend);
    if(P.include_tube_fluid) put(P.Di/2, M.ref, G.ref);
  });

  // --- 유동 도메인 ---
  if(P.autoExt){ const a=autoExtents(); P.L_up=a.up; P.L_down=a.down; }
  const K=duct();
  boxMesh(b.x0-P.L_up,b.x0,K.y0,K.y1,K.z0,K.z1,M.air,M.edgeAir).forEach(o=>G.air.add(o));
  boxMesh(b.x1,b.x1+P.L_down,K.y0,K.y1,K.z0,K.z1,M.air,M.edgeAir).forEach(o=>G.air.add(o));
  const nSlab=P.split_core_by_row?P.Nr:1, sw=(b.x1-b.x0)/nSlab;
  for(let i=0;i<nSlab;i++)
    boxMesh(b.x0+i*sw,b.x0+(i+1)*sw,b.y0,b.y1,b.z0,b.z1,M.core,M.edgeCore).forEach(o=>G.core.add(o));
  if(!K.sealed)   // 바이패스 유로 (덕트 간극)
    boxMesh(b.x0,b.x1,K.y0,K.y1,K.z0,K.z1,M.byp,M.edgeByp).forEach(o=>G.byp.add(o));

  applyVis();
  frame(false);
}
function applyVis(){
  Object.keys(G).forEach(k=>G[k].visible=!!P.show[k]);
  G.ref.visible = !!P.show.ref && P.include_tube_fluid;

/* ---------- 오빗 컨트롤 ---------- */
const target=new THREE.Vector3();
let sph={r:1200,th:Math.PI*0.32,ph:Math.PI*0.36}, drag=null, userView=false;

/* ── 프레이밍 ──────────────────────────────────────────────
   viewMode="core" : 열교환기 코어(관+핀+벤드) 를 화면 중앙에 꽉 채움  ← 기본
   viewMode="all"  : 상·하류 연장까지 포함한 전체 유동 도메인
   바운딩구가 아니라 카메라 축(right/up/forward)에 8개 꼭짓점을 투영해
   가로·세로 각각 필요한 거리를 구하므로, 어떤 종횡비·각도에서도 정확히 중앙에 옴 */
let viewMode="core";

function fullBox(){
  const b=bbox();
  return {x0:b.x0-P.L_up, x1:b.x1+P.L_down, y0:b.y0, y1:b.y1, z0:b.z0, z1:b.z1};
}
function coreBox(){
  const b=bbox(), TZ=tubeZ();
  const e=P.include_bends? (CIRC.rep.standoff.max_protrusion_mm||P.Pt/2)+8 : 0;
  return {x0:b.x0, x1:b.x1, y0:b.y0, y1:b.y1, z0:TZ[0]-e, z1:TZ[1]+e};
}
function camBasis(){
  const z=new THREE.Vector3(Math.sin(sph.ph)*Math.sin(sph.th),
                            Math.cos(sph.ph),
                            Math.sin(sph.ph)*Math.cos(sph.th)).normalize();
  const x=new THREE.Vector3(0,1,0).cross(z);
  if(x.lengthSq()<1e-9) x.set(1,0,0);
  x.normalize();
  const y=z.clone().cross(x).normalize();
  return {x,y,z};
}
function frame(force){
  if(userView && !force){ place(); return; }
  const f = (viewMode==="core") ? coreBox() : fullBox();
  const c = new THREE.Vector3((f.x0+f.x1)/2,(f.y0+f.y1)/2,(f.z0+f.z1)/2);
  const B = camBasis();
  let hx=0, hy=0, hz=0, v=new THREE.Vector3();
  for(const X of [f.x0,f.x1]) for(const Y of [f.y0,f.y1]) for(const Z of [f.z0,f.z1]){
    v.set(X,Y,Z).sub(c);
    hx=Math.max(hx,Math.abs(v.dot(B.x)));
    hy=Math.max(hy,Math.abs(v.dot(B.y)));
    hz=Math.max(hz,Math.abs(v.dot(B.z)));
  }
  const tV=Math.tan(camera.fov*Math.PI/360);
  const tH=tV*Math.max(camera.aspect,.3);
  target.copy(c);
  sph.r = Math.max(hy/tV, hx/tH)*1.10 + hz;
  if(force) userView=false;
  place();
}
function place(){
  camera.position.set(
    target.x+sph.r*Math.sin(sph.ph)*Math.sin(sph.th),
    target.y+sph.r*Math.cos(sph.ph),
    target.z+sph.r*Math.sin(sph.ph)*Math.cos(sph.th));
  camera.lookAt(target);
}
view.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY,pan:e.shiftKey||e.button===2};
  view.setPointerCapture(e.pointerId);});
view.addEventListener("pointermove",e=>{
  if(!drag)return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.x=e.clientX; drag.y=e.clientY;
  if(drag.pan){
    const s=sph.r*0.0014;
    const right=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0);
    const up=new THREE.Vector3().setFromMatrixColumn(camera.matrix,1);
    target.addScaledVector(right,-dx*s).addScaledVector(up,dy*s); userView=true;
  } else { sph.th-=dx*.007; sph.ph=Math.max(.05,Math.min(Math.PI-.05,sph.ph-dy*.007)); }
  place();
});
addEventListener("pointerup",()=>drag=null);
view.addEventListener("contextmenu",e=>e.preventDefault());
view.addEventListener("wheel",e=>{e.preventDefault();
  sph.r=Math.max(40,Math.min(30000,sph.r*(1+Math.sign(e.deltaY)*.11))); userView=true; place();},{passive:false});

function resize(){
  const w=view.clientWidth,h=view.clientHeight;
  renderer.setSize(w,h,true); camera.aspect=w/h; camera.updateProjectionMatrix();
}

function airProps(){ const T=(P.T_air||27)+273.15, Pa=101325;

function collectTris(groups){
  const tris=[], A=new THREE.Vector3(),B=new THREE.Vector3(),Cv=new THREE.Vector3(),
        im=new THREE.Matrix4();
  groups.forEach(g=>g.traverse(n=>{
    if(!n.isMesh) return;
    n.updateWorldMatrix(true,false);
    const geo=n.geometry, pos=geo.attributes.position, idx=geo.index;
    const nt = idx ? idx.count/3 : pos.count/3;
    const mats=[];
    if(n.isInstancedMesh){
      for(let i=0;i<n.count;i++){ n.getMatrixAt(i,im);
        mats.push(new THREE.Matrix4().multiplyMatrices(n.matrixWorld,im)); }
    } else mats.push(n.matrixWorld.clone());
    mats.forEach(Mx=>{
      for(let t=0;t<nt;t++){
        const a=idx?idx.getX(t*3):t*3, b=idx?idx.getX(t*3+1):t*3+1, c=idx?idx.getX(t*3+2):t*3+2;
        A.fromBufferAttribute(pos,a).applyMatrix4(Mx);
        B.fromBufferAttribute(pos,b).applyMatrix4(Mx);
        Cv.fromBufferAttribute(pos,c).applyMatrix4(Mx);
        tris.push(A.x,A.y,A.z,B.x,B.y,B.z,Cv.x,Cv.y,Cv.z);
      }
    });
  }));
  return tris;
}
function binarySTL(tris){
  const n=tris.length/9, buf=new ArrayBuffer(84+n*50), dv=new DataView(buf);
  const head="FT-HX CFD Studio binary STL (mm)";
  for(let i=0;i<head.length;i++) dv.setUint8(i,head.charCodeAt(i));
  dv.setUint32(80,n,true);
  const u=new THREE.Vector3(),v=new THREE.Vector3(),nv=new THREE.Vector3();
  for(let t=0;t<n;t++){
    const o=t*9, p=84+t*50;
    u.set(tris[o+3]-tris[o],tris[o+4]-tris[o+1],tris[o+5]-tris[o+2]);
    v.set(tris[o+6]-tris[o],tris[o+7]-tris[o+1],tris[o+8]-tris[o+2]);
    nv.crossVectors(u,v).normalize();
    dv.setFloat32(p,nv.x,true); dv.setFloat32(p+4,nv.y,true); dv.setFloat32(p+8,nv.z,true);
    for(let k=0;k<9;k++) dv.setFloat32(p+12+k*4,tris[o+k],true);
    dv.setUint16(p+48,0,true);
  }
  return new Blob([buf],{type:"model/stl"});
}
function save(blob,fn){
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fn;
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

    const v=await r.json();
    GIT=v.git;
    if(!GIT||!GIT.is_repo){ UPDERR="notrepo"; btnU.title="git 저장소가 아님 (zip 설치)"; return; }
    UPDERR=null;
    btnU.title=`v${v.version} · ${GIT.branch} @ ${GIT.commit}`
             + (GIT.reload_mode?" · 자동 재시작 켜짐":" · 재시작 수동");
  }catch(e){ UPDERR="offline"; btnU.title="로컬 서버 없음 — python run.py 로 실행"; }
}
probeVersion();

const HELP={
  endpoint:`이 서버에는 <code>/api/version</code> 이 없음 — 업데이트 기능이 추가되기
    전 버전임. <b>최초 1회만 수동으로</b> 받아야 함:
    <br><br><code>git pull</code><br><code>python run.py --reload</code>
    <br><br>이후로는 이 버튼으로 갱신됨.`,
  notrepo:`git 저장소가 아니어서 업데이트할 수 없음. zip 으로 설치한 경우임.
    <br><br><code>git clone https://github.com/kimjy2576/fthx-cfd-studio.git</code>
    <br>로 다시 받으면 이 버튼을 쓸 수 있음.`,
  offline:`로컬 서버에 연결되지 않음. 파일을 직접 열었거나 서버가 꺼져 있음.
    <br><br><code>python run.py --reload</code> 로 띄운 뒤
    <code>http://127.0.0.1:8020</code> 으로 접속할 것.`
};

btnU.onclick=async()=>{
  if(UPDERR){                        // 비활성화하지 않고 이유를 보여줌
    await probeVersion();            // 그동안 서버가 떴을 수도 있으니 재확인
    if(UPDERR){ toast("업데이트 불가",
      HELP[UPDERR]||("알 수 없는 오류: "+UPDERR), true); return; }
  }
  const old=btnU.textContent; btnU.textContent="확인 중…"; btnU.disabled=true;
  try{
    const r=await fetch("/api/update",{method:"POST"});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){
      const dt=j.detail;
      if(dt&&dt.dirty) toast("업데이트 중단",
        `<b>${dt.message}</b><ul>${dt.dirty.map(x=>`<li>${x}</li>`).join("")}</ul>`,true);
      else if(dt&&typeof dt==="object"){
        let h=`<b>${dt.message||"오류"}</b>`;
        if(dt.returncode!==undefined) h+=`<br>exit code <code>${dt.returncode}</code>`;
        if(dt.ahead!==undefined) h+=`<br>로컬 ${dt.ahead}개 앞 · 원격 ${dt.behind}개 뒤`;
        if(dt.stderr) h+=`<br><br><code>${dt.stderr.replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]))}</code>`;
        if(dt.trace) h+=`<br><br><code>${dt.trace.slice(-300).replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]))}</code>`;
        toast("업데이트 실패", h, true);
      }
      else toast("업데이트 실패", String(dt||r.statusText), true);
      return;
    }
    if(!j.updated){ toast("앱 업데이트",
      `이미 최신 버전임 · <code>${j.after}</code>`); return; }
    const list=(j.commits||[]).map(c=>`<li>${c}</li>`).join("");
    toast("업데이트 완료",
      `<b>${j.message}</b><br><code>${j.before}</code> → <code>${j.after}</code>`
      + (list?`<ul>${list}</ul>`:"")
      + (j.restart_required
          ? `<br><br>파이썬 모듈은 이미 로드돼 있어 <b>서버 재시작이 필요함</b>.`
            + ` <code>Ctrl+C</code> 후 <code>python run.py --reload</code>.`
            + `<br><button class="act" style="margin-top:8px" onclick="location.reload()">웹만 새로고침</button>`
          : `<br><br>자동 재시작 모드임. 3초 후 새로고침함.`));
    if(!j.restart_required) setTimeout(()=>location.reload(),3000);
  }catch(e){ toast("업데이트 실패", String(e.message||e), true); }
  finally{ btnU.textContent=old; btnU.disabled=false; }
};

/* ---- 튜토리얼 STEP 다운로드 ---- */
document.querySelectorAll("#tutSeg button").forEach(b=>b.onclick=async()=>{
  const nm=b.dataset.preset, old=b.textContent;
  b.textContent="생성 중…"; b.disabled=true;
  try{
    const r=await fetch(`/api/preset/${nm}/step`);
    if(!r.ok){
      const j=await r.json().catch(()=>({}));
      toast("튜토리얼 STEP 실패",
        String(j.detail||r.statusText)
        + `<br><br>로컬 서버가 필요함. <code>run.bat</code> 또는 <code>./run.sh</code>`
        + ` 로 띄운 뒤 <code>http://127.0.0.1:8020</code> 으로 접속할 것.`, true);
      return;
    }
    save(await r.blob(), `${nm==="tutorial"?"tutorial_1tube":"probe_small"}.step`);
    const info=nm==="tutorial"
      ? "관 1개 · 5 바디<ul><li>fluid_air_up / core_r01 / down</li>"
        +"<li>solid_tube_r01t01</li><li>fluid_ref_r01t01</li></ul>"
        +"Fluent Meshing 임포트 시 <b>Length Unit = mm</b>,"
        +" Describe Geometry 에서 <b>Share Topology = All</b>."
      : "관 3개 + 벤드 2개 · 13 바디<br>비정형 벤드 메싱까지 확인용.";
    toast("튜토리얼 STEP 내려받음", info);
  }catch(e){ toast("튜토리얼 STEP 실패",
      `로컬 서버에 연결되지 않음.<br><br><code>run.bat</code> 으로 띄울 것.`, true); }
  finally{ b.textContent=old; b.disabled=false; }
});

document.getElementById("btnCirc").onclick=ceOpen;
document.getElementById("ceClose").onclick=ceClose;
addEventListener("keydown",e=>{if(e.key==="Escape")ceClose();});
document.querySelectorAll("[data-gen]").forEach(btn=>btn.onclick=()=>{
  CIRC.pattern=btn.dataset.gen;
  CIRC.nc=Math.max(1,parseInt(document.getElementById("ceN").value)||4);
  regenCircuits(); ceRender(); refresh(true);});
document.getElementById("ceN").onchange=e=>{
  CIRC.nc=Math.max(1,parseInt(e.target.value)||4);
  if(CIRC.pattern==="face_split"||CIRC.pattern==="interlaced"){
    regenCircuits(); ceRender(); refresh(true);}};
document.getElementById("ceRevAll").onclick=()=>{
  CIRC.list=CIRC.list.map(reverseCircuit);
  CIRC.pattern="custom"; analyzeCircuits(); ceRender(); refresh(true);};
document.getElementById("ceAdd").onclick=()=>{
  const n=CIRC.list.length+1;
  CIRC.list.push({id:"c"+String(n).padStart(2,"0"),tubes:[],inlet_end:"z0",m_frac:null});
  CIRC.active=CIRC.list.length-1; CIRC.pattern="custom"; analyzeCircuits(); ceRender();};

regenCircuits();
buildUI(); resize(); rebuild(); paint(); axisTriad(); frame(true);

// .view 박스가 실제로 바뀔 때마다 재프레이밍 (폰트 로드·스트립 렌더·창 크기)
if(window.ResizeObserver) new ResizeObserver(()=>{resize();frame(false);}).observe(view);
addEventListener("resize",()=>{if(!document.getElementById("ceModal").hidden)ceRender();});
requestAnimationFrame(()=>{resize();frame(true);});
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{resize();frame(true);});

</script>
